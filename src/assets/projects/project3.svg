<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="bd-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="bd-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="bd-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glass Glow Filter -->
    <filter id="bd-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Deep Backdrop -->
  <rect width="1200" height="675" fill="url(#bd-bg)"/>

  <!-- Background Decorative Glowing Orbs -->
  <circle cx="250" cy="220" r="180" fill="#3b82f6" opacity="0.12" filter="url(#bd-glow)" />
  <circle cx="950" cy="450" r="220" fill="#f59e0b" opacity="0.10" filter="url(#bd-glow)" />
  <circle cx="600" cy="330" r="240" fill="#10b981" opacity="0.08" filter="url(#bd-glow)" />

  <!-- Subtle Blueprint / Grid Lines in Background -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="6,6" opacity="0.5">
    <line x1="100" y1="0" x2="100" y2="675" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="500" y1="0" x2="500" y2="675" />
    <line x1="700" y1="0" x2="700" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
    <line x1="1100" y1="0" x2="1100" y2="675" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="440" x2="1200" y2="440" />
    <line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <!-- Central Glassmorphic Card -->
  <g transform="translate(200, 100)" filter="url(#card-shadow)">
    <!-- Card Frame -->
    <rect width="800" height="475" rx="28" fill="#0f172a" fill-opacity="0.82" stroke="#334155" stroke-width="1.5" />

    <!-- Top Window Control Dots -->
    <circle cx="40" cy="40" r="7" fill="#ef4444" opacity="0.85" />
    <circle cx="62" cy="40" r="7" fill="#f59e0b" opacity="0.85" />
    <circle cx="84" cy="40" r="7" fill="#10b981" opacity="0.85" />
    
    <!-- Top Bar Mock Divider -->
    <line x1="0" y1="72" x2="800" y2="72" stroke="#1e293b" stroke-width="1" />

    <!-- Coming Soon Pill Badge -->
    <g transform="translate(290, 115)">
      <rect width="220" height="42" rx="21" fill="url(#bd-amber)" />
      <circle cx="28" cy="21" r="5" fill="#ffffff" />
      <text x="44" y="27" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" letter-spacing="3">COMING SOON</text>
    </g>

    <!-- Main Project Name -->
    <text x="400" y="235" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
      Bazar Dor
    </text>

    <!-- Project Subtitle -->
    <text x="400" y="280" text-anchor="middle" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="500">
      Bengali Daily Market Price Tracker &amp; Analytics
    </text>

    <!-- Status Note with Icon -->
    <g transform="translate(250, 315)">
      <rect width="300" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="150" y="24" text-anchor="middle" fill="#38bdf8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600">
        &#9881; Under Active Development
      </text>
    </g>

    <!-- Tech Stack Mini Badges at Bottom of Card -->
    <g transform="translate(140, 395)">
      <!-- Badge 1: Next.js -->
      <g transform="translate(0, 0)">
        <rect width="115" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="57" y="22" text-anchor="middle" fill="#e2e8f0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600">Next.js 15</text>
      </g>
      <!-- Badge 2: Better Auth -->
      <g transform="translate(130, 0)">
        <rect width="125" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="62" y="22" text-anchor="middle" fill="#e2e8f0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600">Better Auth</text>
      </g>
      <!-- Badge 3: TypeScript -->
      <g transform="translate(270, 0)">
        <rect width="120" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="60" y="22" text-anchor="middle" fill="#e2e8f0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600">TypeScript</text>
      </g>
      <!-- Badge 4: Tailwind CSS -->
      <g transform="translate(405, 0)">
        <rect width="120" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="60" y="22" text-anchor="middle" fill="#e2e8f0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600">Tailwind CSS</text>
      </g>
    </g>
  </g>
</svg>
